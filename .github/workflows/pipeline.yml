name: Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    name: Build & Type-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server (compile + type-check)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          target: builder
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build web (compile + type-check)
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: false
          target: builder
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          build-args: NEXT_PUBLIC_API_URL=http://localhost:4000

  deploy-staging:
    name: Deploy → Staging
    needs: ci
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Render staging deploy
        run: curl -fsS --retry 3 "${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}"

  deploy-production:
    name: Deploy → Production
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render production deploy
        run: curl -fsS --retry 3 "${{ secrets.RENDER_DEPLOY_HOOK_PROD }}"
